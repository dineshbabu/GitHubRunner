name: Heartbeat Trigger

on:
  schedule:
    - cron: "15 22 * * *"   # 22:15 UTC
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TARGET_TIME: "2352"   # <--- change here only

    steps:
      # ---------------------------------------------------------
      # 1) Guard: wait until target UK time ONLY if still ahead
      # ---------------------------------------------------------
      - name: Wait until target London time
        run: |
          TARGET="${TARGET_TIME}"
          echo "Waiting until ${TARGET:0:2}:${TARGET:2:2} Europe/London local time..."

          NOW=$(TZ=Europe/London date +%H%M)
          echo "Current time: $NOW, target: $TARGET"

          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Target is later today. Waiting until $TARGET..."
            while [ "$(TZ=Europe/London date +%H%M)" -lt "$TARGET" ]; do
              sleep 15
            done
          else
            echo "Target already passed today. Proceeding immediately..."
          fi

          echo "Reached $(TZ=Europe/London date +%H:%M), proceeding..."

      # ---------------------------------------------------------
      # 2) Trigger run-containers.yml
      # ---------------------------------------------------------
      - name: Trigger run-containers.yml
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CLASSIC_GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-containers.yml/dispatches \
            -d '{"ref":"master"}'

      # ---------------------------------------------------------
      # 3) Cancel this heartbeat run
      # ---------------------------------------------------------
      - name: Cancel heartbeat run
        if: always()
        run: |
          echo "Cancelling this heartbeat workflow run..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CLASSIC_GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel